services:
  ror2-server:
    image: ${ROR2_IMAGE:-ror2-local:experimental}
    build: .
    platform: linux/amd64
    init: true
    restart: "on-failure:3"
    stop_grace_period: 45s
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SERVER_MODE: ${SERVER_MODE:-experimental}
      ACK_EXPERIMENTAL: ${ACK_EXPERIMENTAL:-0}
      EXPECTED_GAME_SHA256: ${EXPECTED_GAME_SHA256:-}
      PATCH_MANIFEST: /config/patch-manifest.json
      MAX_PLAYERS: ${MAX_PLAYERS:-4}
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-RoR2 private server}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      PORT: ${PORT:-27015}
      STEAM_QUERY_PORT: ${STEAM_QUERY_PORT:-27016}
      STEAM_SERVER_PORT: ${STEAM_SERVER_PORT:-27017}
      STEAM_HEARTBEAT: ${STEAM_HEARTBEAT:-1}
      SERVER_CUSTOM_TAGS: ${SERVER_CUSTOM_TAGS:-}
      GAMEMODE: ${GAMEMODE:-ClassicRun}
      MODS_ENABLED: ${MODS_ENABLED:-0}
      EXTRA_ARGS_JSON: ${EXTRA_ARGS_JSON:-[]}
      MIN_FREE_MB: ${MIN_FREE_MB:-1024}
      STARTUP_TIMEOUT_SECONDS: ${STARTUP_TIMEOUT_SECONDS:-600}
      RAINS_SERVER_TOOLS: ${RAINS_SERVER_TOOLS:-0}
      RAINS_RESTORE_CLIENT_WWISE: ${RAINS_RESTORE_CLIENT_WWISE:-0}
    volumes:
      - ./game:/source:ro
      - ./config:/config:ro
      - ./mods:/mods:ro
      - ./data:/data
    ports:
      - "${PORT:-27015}:${PORT:-27015}/udp"
      - "${STEAM_QUERY_PORT:-27016}:${STEAM_QUERY_PORT:-27016}/udp"
      - "${STEAM_SERVER_PORT:-27017}:${STEAM_SERVER_PORT:-27017}/udp"
    mem_limit: ${MEMORY_LIMIT:-4g}
    # Reserve headroom for routing/SQM. Set cpuset only after measurement.
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, /opt/ror2/tools/runtime.py, health]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${ROR2_BRIDGE_NAME:-br-ror2}
